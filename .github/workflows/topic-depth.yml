name: Review registered lesson depth
on: [push, pull_request]
permissions:
  contents: read
jobs:
  historical-r5:
    name: Replay the pinned public R5 foundations lesson
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 85211bc61260e8281f90aa15f6119255e1a07f53
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the reviewed lesson and its evidence
        run: |
          python -B tools/topic_depth.py freeze --root .
          python -B tools/topic_depth.py check --root . > "$RUNNER_TEMP/week01-depth.json"
      - run: >-
          python -m pip install
          'nbformat>=5,<6' 'nbclient>=0.10,<0.11' 'ipykernel>=6,<8' 'nbconvert>=7,<8' 'mistune>=3,<4'
          'matplotlib==3.10.8' 'seaborn==0.13.2' 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0'
      - run: python -B -m unittest discover -s tests -p test_topic_depth.py -q
      - run: >-
          python -B reviews/week01-depth-20261118/execute_lesson.py
          lessons/week01/week01_foundations.ipynb --data lessons/week01/data
          --report "$RUNNER_TEMP/week01-kernel.json" --transport subprocess
      - name: Check the student merge and the teacher solution on normal and missing inputs
        shell: bash
        run: |
          case_dir=reviews/week01-depth-20261118
          reviewed_round="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["subject_round"])' "$RUNNER_TEMP/week01-depth.json")"
          python -B "$case_dir/functional/check_public_tables.py" --root . --round "$reviewed_round"
          python -B "$case_dir/functional/check_missing_key_forms.py" --root . --round "$reviewed_round"

  live-r6:
    name: Check the current contest lesson
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the lesson and test dependencies
        run: >-
          python -m pip install
          'nbformat>=5,<6' 'nbclient>=0.10,<0.11' 'ipykernel>=6,<8' 'nbconvert>=7,<8' 'mistune>=3,<4'
          'matplotlib==3.10.8' 'seaborn==0.13.2' 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0'
      - name: Verify the registered live study, current entry and independently reviewed companions
        run: python -B tools/topic_depth.py check --root .
      - name: Verify the current student route and weekly allocation
        run: python -B tools/lesson_route.py inspect --root . --route reviews/week01-contest-20261118/route.json
      - name: Reject old study credit and stale materials in a disposable public checkout
        run: python -B reviews/week01-contest-20261118/check_bindings.py
      - name: Execute the actual contest exercises, changed inputs, teacher key and public CSV
        run: |
          case_dir=reviews/week01-contest-20261118
          ordinal="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["depth"]["round"])' "$case_dir/route.json")"
          python -B "$case_dir/check_course.py" --round "$ordinal" --prove-detection
      - name: Boot the normal R6 Jupyter notebook in a fresh kernel
        run: >-
          jupyter nbconvert --to notebook --execute lessons/week01/week01_foundations.ipynb
          --output week01-executed --output-dir "$RUNNER_TEMP" --ExecutePreprocessor.timeout=90
      - name: Run regressions
        run: python -B -m unittest discover -s tests -q
