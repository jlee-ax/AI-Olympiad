name: Week 1 source-bound native prerequisite review
on:
  push:
    branches: ['codex/course-generation-harness-prereq-20261120']
    paths:
      - '.course-review-ci/**'
      - '.github/workflows/week01-native-prerequisite-ci.yml'
      - 'tools/course*.mjs'
      - 'tools/course*.py'
      - 'lessons/week01/**'
      - 'curriculum/course-harness.json'
      - 'curriculum/contract.json'
      - 'reviews/week01-whole-20261120/**'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the selected evidence phase
        id: mode
        shell: bash
        run: |
          set -eu
          phase=waiting
          if test -f .course-review-ci/phase; then phase="$(cat .course-review-ci/phase)"; fi
          case "$phase" in prepare|run|seal|waiting) ;; *) exit 1 ;; esac
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Requested native evidence phase $phase"
      - name: Install the tested notebook runtime
        if: steps.mode.outputs.phase == 'run'
        run: |
          python -m pip install --timeout 30 --retries 2 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0' 'matplotlib==3.10.8' 'seaborn==0.13.2' 'nbclient==0.11.0' 'nbformat==5.11.1' 'ipykernel==7.4.0'
      - name: Install the fonts used by the distributed notebooks
        if: steps.mode.outputs.phase == 'run'
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y fonts-noto-cjk
      - name: Verify the two checked-in student notebooks against the executed release
        if: steps.mode.outputs.phase == 'run'
        run: |
          echo '0db53506ef32c84b18b26357db8a74a1ded34a0385ffeffaddb934878a454afb  lessons/week01/week01_integrated.ipynb' | sha256sum --check
          echo '45ff37ffed2ecb5b231a0ebbe9b23bd8a730aef4a27639a090bc6313fa0a778e  lessons/week01/week01_problem_pipeline.ipynb' | sha256sum --check
      - name: Verify and export only the declared public receipt
        if: steps.mode.outputs.phase != 'waiting'
        env:
          NATIVE_PHASE: ${{ steps.mode.outputs.phase }}
        run: python -B .course-review-ci/native.py "$NATIVE_PHASE"
